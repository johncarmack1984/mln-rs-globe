[package]
name = "mln-rs-globe"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A spinning globe with an atmosphere and stars, drawn by mln-rs in a winit window"
license = "BSD-2-Clause"
repository = "https://github.com/johncarmack1984/mln-rs-globe"
# Not on crates.io (a git dependency can't be), but released with dist:
# dist-workspace.toml and .github/workflows/release.yml.
publish = false

[package.metadata.dist]
dist = true

[dependencies]
# The globe and the sky from their pull request to louwers/mln-rs, at the commit
# this was built against, which a tag on the fork keeps. 0.0.11 on crates.io has
# the globe, but its API changed, and its sky lacks this commit's fix to the
# sun's position.
mln-rs = { git = "https://github.com/johncarmack1984/mln-rs", tag = "globe-pr-534749b" }
pollster = "1.0.1"
wgpu = "30.0.1"
winit = "0.30.13"

# mln-rs is slow unoptimized, so `cargo run` optimizes the dependencies and
# leaves only this crate's code unoptimized.
[profile.dev.package."*"]
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
